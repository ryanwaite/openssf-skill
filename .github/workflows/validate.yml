name: Validate skill

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests and examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install maintainer-only YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Run offline tests
        run: python -m unittest discover -s tests -q
      - name: Check extracted workflow examples
        run: python scripts/check-compatibility.py

  optional-cvss:
    name: Optional evidence validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install optional parsing and schema extras
        run: |
          python -m pip install -r skills/audit/requirements-optional.txt \
            -r skills/audit/requirements-metadata.txt -r skills/audit/requirements-sbom.txt
      - name: Run evidence and fallback fixtures
        run: python -m unittest discover -s tests -q

  drift:
    name: Scheduled live ref drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install maintainer-only YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Resolve template refs and publish dated result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check-compatibility.py --live | tee -a "$GITHUB_STEP_SUMMARY"
